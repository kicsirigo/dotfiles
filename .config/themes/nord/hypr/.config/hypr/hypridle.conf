general {
    # Avoid needing an extra keypress after resume
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off && brightnessctl -sd "*kbd_backlight*" set 0
    on-resume = hyprctl dispatch dpms on && brightnessctl -sd "*kbd_backlight*" set 100
}
